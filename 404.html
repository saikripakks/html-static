<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | DevOps Pages</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .not-found-code {
      font-size: 6rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container not-found-container">
    <div class="badge">Error 404</div>
    <div class="not-found-code text-gradient">404</div>
    <h2 style="margin-bottom: 1rem;">Oops! Route Not Found</h2>
    <p style="color: var(--text-secondary); max-width: 500px; margin-bottom: 2rem;">
      The static asset or route you are looking for does not exist on this GitHub Pages deployment.
    </p>
    <a href="index.html" class="btn btn-primary">Return to Homepage</a>
  </div>
</body>
</html>
